<!-- Soldavia: logo monogramme + favicon (2026-06-03) -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soldavia</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 52 52'><rect x='2' y='2' width='48' height='48' rx='13' fill='%2315926C'/><text x='26' y='37' text-anchor='middle' font-family='Arial' font-size='32' font-weight='700' fill='white'>S</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.17.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --green:#15926C;--green-d:#0E6B4E;--green-dd:#0A4F3A;--green-l:#E7F4EF;
    --side:#103D2E;--side-2:#0C3024;
    --ink:#13211C;--muted:#67746D;--faint:#9AA6A0;
    --line:#E8ECEA;--bg:#F3F6F4;--card:#FFFFFF;
    --amber:#9A6311;--amber-l:#FBF0DC;--red:#B23A3A;--red-l:#FBEAEA;
    --r:14px;--r-lg:18px;--sh:0 1px 2px rgba(16,40,30,.06),0 2px 8px rgba(16,40,30,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input,select{font-family:inherit;font-size:14px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%;color:var(--ink);transition:border-color .15s;}
  input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(21,146,108,.12);}
  input::placeholder{color:var(--faint);}
  .btn{background:var(--green);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:background .15s,transform .05s;}
  .btn:hover{background:var(--green-d);}
  .btn:active{transform:scale(.985);}
  .btn-sm{padding:7px 12px;font-size:13px;}
  .btn-ghost{background:#fff;color:var(--green-d);border:1.5px solid #CFE3DA;}
  .btn-ghost:hover{background:var(--green-l);}
  .btn-soft{background:var(--green-l);color:var(--green-dd);}
  .btn-soft:hover{background:#D8EDE4;}
  .btn-danger{background:#fff;color:var(--red);border:1.5px solid #EBCccc;}
  .btn-danger:hover{background:var(--red-l);}
  .icon-btn{color:var(--muted);padding:6px;border-radius:8px;font-size:18px;}
  .icon-btn:hover{background:var(--line);color:var(--ink);}
  /* layout */
  .app{display:flex;min-height:100vh;}
  .sidebar{width:250px;background:var(--side);color:#fff;position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;padding:22px 16px;z-index:10;}
  .brand{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:700;padding:4px 8px 2px;}
  .brand .em{font-size:24px;}
  .resto{font-size:12.5px;color:rgba(255,255,255,.55);padding:2px 8px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px;}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;color:rgba(255,255,255,.72);padding:10px 12px;border-radius:10px;font-size:14.5px;font-weight:500;transition:.12s;}
  .nav button i{font-size:19px;width:20px;}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff;}
  .nav button.active{background:var(--green);color:#fff;}
  .side-foot{font-size:11.5px;color:rgba(255,255,255,.4);padding:10px 8px 0;}
  .content{flex:1;margin-left:250px;padding:32px 36px 64px;max-width:1180px;}
  /* headings */
  .phead{margin-bottom:24px;}
  h1{font-size:25px;font-weight:700;letter-spacing:-.01em;}
  .phead p{color:var(--muted);font-size:14.5px;margin-top:3px;}
  h2{font-size:16px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  h2 i{color:var(--green);font-size:18px;}
  /* cards */
  .card{background:var(--card);border-radius:var(--r-lg);padding:22px 24px;margin-bottom:20px;box-shadow:var(--sh);}
  .grid{display:grid;gap:16px;}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
  .kpi{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);}
  .kpi .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px;background:var(--green-l);color:var(--green-d);}
  .kpi .lbl{font-size:12.5px;color:var(--muted);}
  .kpi .val{font-size:26px;font-weight:700;margin-top:1px;letter-spacing:-.01em;}
  /* table */
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600;}
  td{padding:12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFBFA;}
  .right{text-align:right;}
  .sub{font-size:12.5px;color:var(--faint);margin-top:2px;}
  /* form rows */
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row>*{flex:1;min-width:130px;}
  .row .narrow{flex:0 0 120px;min-width:100px;}
  .field{margin-bottom:0;}
  label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500;}
  .form-actions{margin-top:18px;display:flex;gap:10px;align-items:center;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .lines-head{display:flex;gap:12px;font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;padding:0 2px 6px;font-weight:600;}
  /* misc */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;}
  .pill.ok{background:var(--green-l);color:var(--green-dd);}
  .pill.low{background:var(--red-l);color:var(--red);}
  .pill.warn{background:var(--amber-l);color:var(--amber);}
  .chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px;box-shadow:var(--sh);}
  .empty{color:var(--faint);font-size:14px;text-align:center;padding:34px 14px;}
  .empty i{font-size:30px;display:block;margin-bottom:8px;color:var(--line);}
  .muted{color:var(--muted);font-size:13px;}
  .banner{background:var(--green-l);color:var(--green-dd);border-radius:12px;padding:13px 16px;font-size:14px;display:flex;align-items:center;gap:9px;margin-bottom:16px;}
  .editing{background:var(--amber-l);color:var(--amber);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;margin-bottom:14px;display:inline-flex;align-items:center;gap:7px;}
  .datebtn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px;cursor:pointer;color:var(--ink);font-family:inherit;}
  .datebtn.act,.datebtn:hover{border-color:var(--green);}
  .cal{position:absolute;top:48px;left:0;z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px -16px rgba(16,40,30,.35);padding:12px;width:286px;}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cal-title{font-weight:600;font-size:14px;}
  .cal-nav{background:transparent;border:none;cursor:pointer;color:var(--muted);padding:6px 9px;border-radius:8px;font-size:18px;}
  .cal-nav:hover{background:var(--line);color:var(--ink);}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
  .cal-week span{text-align:center;font-size:11px;color:var(--faint);font-weight:600;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-day{height:34px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink);font-family:inherit;}
  .cal-day:hover{background:var(--green-l);}
  .cal-day.empty{visibility:hidden;cursor:default;}
  .cal-day.today{outline:1.5px solid var(--green);outline-offset:-1px;}
  .cal-day.sel{background:var(--green);color:#fff;font-weight:700;}
  #printArea{display:none;}
  @media print{body *{visibility:hidden;}#printArea,#printArea *{visibility:visible;}#printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:30px;}}
  @media(max-width:860px){
    .sidebar{position:static;width:100%;flex-direction:column;padding:14px;}
    .nav{flex-direction:row;overflow-x:auto;gap:4px;}
    .nav button{flex-direction:column;gap:4px;font-size:11px;padding:8px 10px;white-space:nowrap;}
    .nav button i{font-size:20px;}
    .resto,.side-foot{display:none;}
    .content{margin-left:0;padding:22px 16px 50px;}
    .app{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand" id="brand"><svg width="24" height="24" viewBox="0 0 52 52" style="vertical-align:middle;margin-right:7px"><rect x="2" y="2" width="48" height="48" rx="13" fill="#15926C"/><text x="26" y="36" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">S</text></svg>Soldavia</div>
    <div class="resto" id="restoName"></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Données enregistrées sur cet appareil</div>
  </aside>
  <main class="content" id="content"></main>
</div>
<div id="printArea"></div>

<script>
"use strict";
const KEY="mijote_db_v2";
const REASONS=["Périmé","Abîmé","Invendu","Erreur de prépa","Casse"];
const CATS=["Légumes","Fruits","Viande","Poisson","Crémerie","Épicerie","Boisson","Autre"];
const TABS=[
 ["dash","Tableau de bord","ti-layout-dashboard"],
 ["stock","Stock & inventaire","ti-building-warehouse"],
 ["products","Produits","ti-tag"],
 ["suppliers","Fournisseurs","ti-truck"],
 ["invoices","Factures","ti-file-invoice"],
 ["orders","Commandes","ti-shopping-cart"],
 ["recipes","Recettes","ti-chef-hat"],
 ["sales","Ventes","ti-cash-register"],
 ["losses","Pertes","ti-trash"],
 ["comp","Conformité","ti-leaf"],
 ["settings","Réglages","ti-settings"],
];

let DB=load();
let view="dash";
let tmp={invLines:[],recLines:[],orderQty:{}};
let edit={prod:null,sup:null};
let editRecId=null;

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.products){d.sales=d.sales||[];d.settings=d.settings||{restaurant:""};if(!d.settings.currency)d.settings.currency="€";return d;}}catch(e){}
  return {settings:{restaurant:"",currency:"€"},suppliers:[],products:[],invoices:[],recipes:[],sales:[],losses:[],biodechets:[]};}
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function money(n){return (Math.round((n||0)*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+((DB.settings&&DB.settings.currency)||'€');}
function num(n){return (Math.round((n||0)*100)/100).toLocaleString('fr-FR');}
function today(){return new Date().toISOString().slice(0,10);}
function fr(d){if(!d)return"";const p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function prod(id){return DB.products.find(p=>p.id===id);}
function prodName(id){const p=prod(id);return p?p.name:"—";}
function sup(id){return DB.suppliers.find(x=>x.id===id);}
function supName(id){const s=sup(id);return s?s.name:"—";}
function daysAgo(d,n){const t=new Date();t.setDate(t.getDate()-n);return new Date(d)>=t;}

function stockValue(){return DB.products.reduce((s,p)=>s+(p.stock||0)*(p.price||0),0);}
function lowStock(){return DB.products.filter(p=>(p.stock||0)<=(p.threshold||0));}
function recipeCost(r){return r.lines.reduce((s,l)=>{const p=prod(l.productId);return s+(p?(p.price||0)*l.qty:0);},0);}
function avgFoodCost(){const rs=DB.recipes.filter(r=>r.price>0);if(!rs.length)return null;
  return Math.round(rs.reduce((s,r)=>s+recipeCost(r)/r.price,0)/rs.length*100);}
function lossesWeek(){return DB.losses.filter(l=>daysAgo(l.date,7)).reduce((s,l)=>{const p=prod(l.productId);return s+(p?(p.price||0)*l.qty:0);},0);}
function biodWeek(){return DB.biodechets.filter(b=>daysAgo(b.date,7)).reduce((s,b)=>s+(b.kg||0),0);}
function expiringSoon(){const lim=new Date();lim.setDate(lim.getDate()+3);return DB.products.filter(p=>p.dlc).filter(p=>new Date(p.dlc)<=lim);}
function salesWeek(){return (DB.sales||[]).filter(s=>daysAgo(s.date,7));}
function revenueWeek(){return salesWeek().reduce((a,s)=>{const r=DB.recipes.find(x=>x.id===s.recipeId);return a+(r?(r.price||0)*s.qty:0);},0);}
function realFoodCost(){const sw=salesWeek();if(!sw.length)return null;let rev=0,cost=0;sw.forEach(s=>{const r=DB.recipes.find(x=>x.id===s.recipeId);if(r){rev+=(r.price||0)*s.qty;cost+=recipeCost(r)*s.qty;}});return rev>0?Math.round(cost/rev*100):null;}
let dashP={mode:'week',from:'',to:''};
function dashRange(){const end=new Date();end.setHours(23,59,59,999);let start=new Date();if(dashP.mode==='7j'){start.setDate(start.getDate()-6);}else if(dashP.mode==='week'){const day=(start.getDay()+6)%7;start.setDate(start.getDate()-day);}else if(dashP.mode==='month'){start=new Date(start.getFullYear(),start.getMonth(),1);}else if(dashP.mode==='year'){start=new Date(start.getFullYear(),0,1);}else if(dashP.mode==='custom'){start=dashP.from?new Date(dashP.from):new Date(0);if(dashP.to){const e=new Date(dashP.to);e.setHours(23,59,59,999);end.setTime(e.getTime());}}start.setHours(0,0,0,0);return {start:start,end:end};}
function inDash(ds){const d=new Date(ds);const r=dashRange();return d>=r.start&&d<=r.end;}
function dashLabel(){return ({week:'cette semaine',month:'ce mois',year:'cette année',custom:'période choisie'})[dashP.mode];}
let pick={open:null,y:new Date().getFullYear(),m:new Date().getMonth()};
function calPopup(){const y=pick.y,m=pick.m;const names=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];const lead=(new Date(y,m,1).getDay()+6)%7;const nb=new Date(y,m+1,0).getDate();const sel=pick.open==='from'?dashP.from:dashP.to;const t0=today();let cells='';for(let i=0;i<lead;i++){cells+='<span class="cal-day empty"></span>';}for(let d=1;d<=nb;d++){const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const cls=(ds===sel?'sel ':'')+(ds===t0?'today ':'');cells+='<button class="cal-day '+cls+'" data-act="calPick" data-d="'+ds+'">'+d+'</button>';}return '<div class="cal"><div class="cal-head"><button class="cal-nav" data-act="calPrev"><i class="ti ti-chevron-left"></i></button><span class="cal-title">'+names[m]+' '+y+'</span><button class="cal-nav" data-act="calNext"><i class="ti ti-chevron-right"></i></button></div><div class="cal-week"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="cal-grid">'+cells+'</div></div>';}
function lossesP(){return DB.losses.filter(l=>inDash(l.date)).reduce((s,l)=>{const p=prod(l.productId);return s+(p?(p.price||0)*l.qty:0);},0);}
function biodP(){return DB.biodechets.filter(b=>inDash(b.date)).reduce((s,b)=>s+(b.kg||0),0);}
function salesP(){return (DB.sales||[]).filter(s=>inDash(s.date));}
function realFoodCostP(){const sw=salesP();if(!sw.length)return null;let rev=0,cost=0;sw.forEach(s=>{const r=DB.recipes.find(x=>x.id===s.recipeId);if(r){rev+=(r.price||0)*s.qty;cost+=recipeCost(r)*s.qty;}});return rev>0?Math.round(cost/rev*100):null;}

function renderNav(){
  document.getElementById("nav").innerHTML=TABS.map(t=>`<button class="${view===t[0]?'active':''}" data-act="tab" data-v="${t[0]}"><i class="ti ${t[2]}"></i><span>${t[1]}</span></button>`).join("");
  document.getElementById("restoName").textContent=DB.settings.restaurant||"";
  const br=document.getElementById("brand");if(br)br.innerHTML=(DB.settings.logo?`<img src="${DB.settings.logo}" alt="" style="height:26px;border-radius:6px;vertical-align:middle;margin-right:6px;">`:`<svg width="24" height="24" viewBox="0 0 52 52" style="vertical-align:middle;margin-right:7px"><rect x="2" y="2" width="48" height="48" rx="13" fill="#15926C"/><text x="26" y="36" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">S</text></svg>`)+"Soldavia";
}
function render(){
  if(!DB.settings.restaurant)view="onboard";
  renderNav();
  document.getElementById("content").innerHTML=({onboard:vOnboard,dash:vDash,stock:vStock,products:vProducts,suppliers:vSuppliers,invoices:vInvoices,orders:vOrders,recipes:vRecipes,sales:vSales,losses:vLosses,comp:vComp,settings:vSettings}[view]||vDash)();
  if(view==="invoices")paintInvLines();
  if(view==="recipes")paintRecLines();
  if(view==="dash")drawDash();
}
function head(t,s){return `<div class="phead"><h1>${t}</h1>${s?`<p>${s}</p>`:""}</div>`;}

/* onboarding */
function vOnboard(){
  return `<div style="max-width:460px;margin:8vh auto 0;">
    <div class="card">
      <div style="text-align:center;"><svg width="56" height="56" viewBox="0 0 52 52" aria-hidden="true"><rect x="2" y="2" width="48" height="48" rx="13" fill="#15926C"/><text x="26" y="36" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">S</text></svg></div>
      <h1 style="text-align:center;margin:6px 0 4px;">Bienvenue sur Soldavia</h1>
      <p class="muted" style="text-align:center;margin-bottom:20px;">Indiquez le nom de votre restaurant pour démarrer.</p>
      <div class="field"><label>Nom du restaurant</label><input id="resto" placeholder="Ex. La Petite Pizzeria"></div>
      <div class="form-actions" style="justify-content:center;">
        <button class="btn" data-act="saveResto"><i class="ti ti-arrow-right"></i> Commencer</button>
        <button class="btn-soft btn" data-act="demo"><i class="ti ti-sparkles"></i> Données de démo</button>
      </div>
    </div>
  </div>`;
}

/* dashboard */
function vDash(){
  const fc=avgFoodCost(),low=lowStock().length,rfc=realFoodCostP(),exp=expiringSoon().length,pl=dashLabel();
  return head("Tableau de bord","Vue d'ensemble de "+esc(DB.settings.restaurant))+`
  <div class="card" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 18px;margin-bottom:18px;">
    <span class="muted" style="font-weight:600;margin-right:4px;"><i class="ti ti-calendar"></i> Période :</span>
    <button class="btn btn-sm ${dashP.mode==='week'?'':'btn-ghost'}" data-act="dashPeriod" data-m="week">Semaine en cours</button>
    <button class="btn btn-sm ${dashP.mode==='month'?'':'btn-ghost'}" data-act="dashPeriod" data-m="month">Mois en cours</button>
    <button class="btn btn-sm ${dashP.mode==='year'?'':'btn-ghost'}" data-act="dashPeriod" data-m="year">Année en cours</button>
    <button class="btn btn-sm ${dashP.mode==='custom'?'':'btn-ghost'}" data-act="dashPeriod" data-m="custom">Personnalisé</button>
    ${dashP.mode==='custom'?`<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:relative;"><button class="datebtn ${pick.open==='from'?'act':''}" data-act="calOpen" data-f="from"><i class="ti ti-calendar"></i> ${dashP.from?fr(dashP.from):'Début'}</button><span class="muted">→</span><button class="datebtn ${pick.open==='to'?'act':''}" data-act="calOpen" data-f="to"><i class="ti ti-calendar"></i> ${dashP.to?fr(dashP.to):'Fin'}</button>${(dashP.from||dashP.to)?`<button class="btn btn-sm btn-ghost" data-act="dashClear"><i class="ti ti-x"></i> Effacer</button>`:""}${pick.open?calPopup():""}</span>`:""}
  </div>
  <div class="grid kpis" style="margin-bottom:22px;">
    <div class="kpi"><div class="ic" style="background:var(--green-l);color:var(--green-d)"><i class="ti ti-percentage"></i></div><div class="lbl">Coût matière moyen</div><div class="val">${fc==null?"—":fc+"%"}</div></div>
    <div class="kpi"><div class="ic" style="background:#E6EFFB;color:#1B5FA8"><i class="ti ti-cash"></i></div><div class="lbl">Coût matière réel · ${pl}</div><div class="val">${rfc==null?"—":rfc+"%"}</div></div>

function recLineRow(l,idx){

function paintRecLines(){const el=document.getElementById("recLines");if(!el)return;
  el.innerHTML=tmp.recLines.length?tmp.recLines.map(recLineRow).join(""):'<p class="muted">Aucun ingrédient.</p>';
  const cost=tmp.recLines.reduce((s,l)=>{const p=prod(l.productId);return s+(p?(p.price||0)*(l.qty||0):0);},0);

  const c=document.getElementById("recCost"),m=document.getElementById("recMargin");

let _chartObjs=[];
function drawDash(){
  if(typeof Chart==="undefined")return;
  _chartObjs.forEach(c=>c.destroy());_chartObjs=[];
  const labels=[],vals=[];
  for(let k=6;k>=0;k--){const d=new Date();d.setDate(d.getDate()-k);const iso=d.toISOString().slice(0,10);
    labels.push(iso.slice(8,10)+"/"+iso.slice(5,7));
    vals.push(Math.round(DB.losses.filter(l=>l.date===iso).reduce((s,l)=>{const p=prod(l.productId);return s+(p?(p.price||0)*l.qty:0);},0)*100)/100);}
  const e1=document.getElementById("chLoss");
  if(e1)_chartObjs.push(new Chart(e1,{type:"bar",data:{labels,datasets:[{data:vals,backgroundColor:"#E2A0A0",borderColor:"#B23A3A",borderWidth:1}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}));
  const rs=DB.recipes.filter(r=>r.price>0);
  const e2=document.getElementById("chFc");
  if(e2)_chartObjs.push(new Chart(e2,{type:"bar",data:{labels:rs.map(r=>r.name),datasets:[{data:rs.map(r=>Math.round(recipeCost(r)/r.price*100)),backgroundColor:"#86C9AE",borderColor:"#15926C",borderWidth:1}]},options:{indexAxis:"y",responsive:true,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,suggestedMax:100}}}}));
}
function vOrders(){
  const low=lowStock();
  if(!low.length)return head("Commandes","Suggestions de réapprovisionnement selon vos seuils d'alerte.")+`<div class="card"><div class="empty"><i class="ti ti-circle-check"></i>Aucun produit sous le seuil. Tout va bien !</div></div>`;
  const groups={};
  low.forEach(p=>{const k=p.supplierId||"";(groups[k]=groups[k]||[]).push(p);});
  let html=head("Commandes","Produits sous le seuil, regroupés par fournisseur. Ajustez les quantités puis imprimez le bon de commande.");
  Object.keys(groups).forEach(k=>{
    const rows=groups[k].map(p=>{
      const sug=Math.max(Math.round(((p.threshold||0)*2-(p.stock||0))*100)/100,0)||1;
      if(tmp.orderQty[p.id]==null)tmp.orderQty[p.id]=sug;
      return `<tr><td><b>${esc(p.name)}</b></td><td>${num(p.stock)} ${esc(p.unit)}</td><td>${num(p.threshold)} ${esc(p.unit)}</td><td class="right"><input type="number" step="0.01" value="${tmp.orderQty[p.id]}" data-act="orderQty" data-id="${p.id}" style="width:90px;text-align:right;"></td><td class="right">${money((p.price||0)*tmp.orderQty[p.id])}</td></tr>`;
    }).join("");
    html+=`<div class="card"><div class="flex-between"><h2 style="margin:0;"><i class="ti ti-truck"></i> ${k?esc(supName(k)):"Sans fournisseur"}</h2><button class="btn btn-sm" data-act="printOrder" data-id="${k}"><i class="ti ti-printer"></i> Bon de commande</button></div><table style="margin-top:12px;"><thead><tr><th>Produit</th><th>Stock</th><th>Seuil</th><th class="right">À commander</th><th class="right">Estimé</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  });
  return html;
}
function printOrder(supId){
  const items=lowStock().filter(p=>(p.supplierId||"")===supId);
  const rows=items.map(p=>{const q=tmp.orderQty[p.id]!=null?tmp.orderQty[p.id]:0;return `<tr><td>${esc(p.name)}</td><td style="text-align:right">${num(q)} ${esc(p.unit)}</td><td style="text-align:right">${money(p.price)}</td><td style="text-align:right">${money((p.price||0)*q)}</td></tr>`;}).join("");
  const tot=items.reduce((s,p)=>s+(p.price||0)*(tmp.orderQty[p.id]||0),0);
  const s=supId?sup(supId):null;
  document.getElementById("printArea").innerHTML=`<h1>Bon de commande</h1><p style="color:#555">${esc(DB.settings.restaurant)}${DB.settings.address?" — "+esc(DB.settings.address):""} · ${fr(today())}</p><p><b>Fournisseur :</b> ${s?esc(s.name):"—"}${s&&s.phone?" · "+esc(s.phone):""}${s&&s.email?" · "+esc(s.email):""}</p><table style="width:100%;border-collapse:collapse;margin-top:14px;"><thead><tr><th style="text-align:left;border-bottom:1px solid #ccc;padding:6px;">Produit</th><th style="text-align:right;border-bottom:1px solid #ccc;padding:6px;">Quantité</th><th style="text-align:right;border-bottom:1px solid #ccc;padding:6px;">Prix unit.</th><th style="text-align:right;border-bottom:1px solid #ccc;padding:6px;">Total</th></tr></thead><tbody>${rows}</tbody></table><p style="margin-top:12px;font-weight:600;text-align:right;">Total estimé : ${money(tot)}</p>`;
  window.print();
}

/* events */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,id=t.dataset.id,i=t.dataset.i!=null?+t.dataset.i:null;
  const v=s=>{const el=document.getElementById(s);return el?el.value:"";};
  switch(a){
    case"tab":edit={prod:null,sup:null};editRecId=null;view=t.dataset.v;render();break;
    case"dashPeriod":dashP.mode=t.dataset.m;pick.open=null;render();break;
    case"calOpen":{const f=t.dataset.f;if(pick.open===f){pick.open=null;}else{pick.open=f;const base=f==='from'?dashP.from:dashP.to;const d=base?new Date(base):new Date();pick.y=d.getFullYear();pick.m=d.getMonth();}render();break;}
    case"calPrev":pick.m--;if(pick.m<0){pick.m=11;pick.y--;}render();break;
    case"calNext":pick.m++;if(pick.m>11){pick.m=0;pick.y++;}render();break;
    case"calPick":if(pick.open==='from'){dashP.from=t.dataset.d;}else{dashP.to=t.dataset.d;}pick.open=null;render();break;
    case"dashClear":dashP.from='';dashP.to='';pick.open=null;render();break;
    case"saveResto":{const n=v("resto").trim();if(!n){alert("Indiquez un nom.");return;}DB.settings.restaurant=n;save();view="dash";render();break;}
    case"demo":loadDemo();break;
    case"cancelEdit":edit={prod:null,sup:null};render();break;
    case"addProd":{const n=v("pName").trim();if(!n){alert("Le nom du produit est requis.");return;}
      const data={name:n,unit:v("pUnit")||"u",category:v("pCat"),price:parseFloat(v("pPrice"))||0,stock:parseFloat(v("pStock"))||0,threshold:parseFloat(v("pThr"))||0,supplierId:v("pSup"),dlc:v("pDlc")||""};
      if(edit.prod){Object.assign(edit.prod,data);edit.prod=null;}else{DB.products.push(Object.assign({id:uid()},data));}
      save();render();break;}
    case"editProd":edit.prod=prod(id);edit.sup=null;view="products";render();window.scrollTo(0,0);break;
    case"delProd":if(confirm("Supprimer ce produit ?")){DB.products=DB.products.filter(x=>x.id!==id);if(edit.prod&&edit.prod.id===id)edit.prod=null;save();render();}break;
    case"addSup":{const n=v("sName").trim();if(!n){alert("Le nom du fournisseur est requis.");return;}
      const data={name:n,contact:v("sContact"),phone:v("sPhone"),email:v("sEmail"),notes:v("sNotes")};
      if(edit.sup){Object.assign(edit.sup,data);edit.sup=null;}else{DB.suppliers.push(Object.assign({id:uid()},data));}
      save();render();break;}
    case"editSup":edit.sup=sup(id);edit.prod=null;view="suppliers";render();window.scrollTo(0,0);break;
    case"delSup":if(confirm("Supprimer ce fournisseur ?")){DB.suppliers=DB.suppliers.filter(x=>x.id!==id);if(edit.sup&&edit.sup.id===id)edit.sup=null;save();render();}break;
    case"addInvLine":tmp.invLines.push({productId:"",qty:0,price:0});paintInvLines();break;
    case"delInvLine":tmp.invLines.splice(i,1);paintInvLines();break;
    case"scanInv":{if(!DB.products.length){alert("Ajoutez d'abord des produits.");return;}
      const sh=DB.products.slice().sort(()=>Math.random()-0.5).slice(0,Math.min(3,DB.products.length));
      tmp.invLines=sh.map(p=>({productId:p.id,qty:Math.round(Math.random()*8+1),price:p.price}));paintInvLines();
      alert("Scan simulé : "+tmp.invLines.length+" lignes détectées. Vérifiez puis enregistrez. (La vraie lecture IA/OCR se branchera plus tard.)");break;}
    case"saveInv":{const lines=tmp.invLines.filter(l=>l.productId&&l.qty>0);if(!lines.length){alert("Ajoutez au moins une ligne valide.");return;}
      const total=lines.reduce((s,l)=>s+l.qty*l.price,0);
      DB.invoices.push({id:uid(),date:v("iDate")||today(),supplierId:v("iSup"),lines,total});
      lines.forEach(l=>{const p=prod(l.productId);if(p){p.stock=(p.stock||0)+l.qty;if(l.price>0)p.price=l.price;}});
      tmp.invLines=[];save();render();alert("Facture enregistrée, stock mis à jour ✔");break;}
    case"delInv":DB.invoices=DB.invoices.filter(x=>x.id!==id);save();render();break;
    case"addRecLine":tmp.recLines.push({productId:"",qty:0});paintRecLines();break;
    case"delRecLine":tmp.recLines.splice(i,1);paintRecLines();break;
    case"saveRec":{const n=v("rName").trim();if(!n){alert("Nom du plat requis.");return;}
      const lines=tmp.recLines.filter(l=>l.productId&&l.qty>0);
      if(editRecId){const r=DB.recipes.find(x=>x.id===editRecId);if(r){r.name=n;r.price=parseFloat(v("rPrice"))||0;r.lines=lines;}editRecId=null;}else{DB.recipes.push({id:uid(),name:n,price:parseFloat(v("rPrice"))||0,lines});}
      tmp.recLines=[];save();render();break;}
    case"delRec":DB.recipes=DB.recipes.filter(x=>x.id!==id);if(editRecId===id){editRecId=null;tmp.recLines=[];}save();render();break;
    case"editRec":{const r=DB.recipes.find(x=>x.id===id);if(r){editRecId=id;tmp.recLines=r.lines.map(l=>({productId:l.productId,qty:l.qty}));view="recipes";render();}break;}
    case"cancelRec":editRecId=null;tmp.recLines=[];render();break;
    case"printOrder":printOrder(id);break;
    case"addSale":{const rid=v("saleRec"),q=parseFloat(v("saleQty"));if(!rid||!q){alert("Plat et quantité requis.");return;}
      const r=DB.recipes.find(x=>x.id===rid);if(r){r.lines.forEach(l=>{const p=prod(l.productId);if(p)p.stock=(p.stock||0)-l.qty*q;});}
      DB.sales=DB.sales||[];DB.sales.push({id:uid(),date:v("saleDate")||today(),recipeId:rid,qty:q});save();render();break;}
    case"delSale":DB.sales=DB.sales.filter(x=>x.id!==id);save();render();break;
    case"addLoss":{const pid=v("lProd"),q=parseFloat(v("lQty"));if(!pid||!q){alert("Produit et quantité requis.");return;}
      DB.losses.push({id:uid(),date:v("lDate")||today(),productId:pid,qty:q,reason:v("lReason")});save();render();break;}
    case"delLoss":DB.losses=DB.losses.filter(x=>x.id!==id);save();render();break;
    case"addBiod":{const k=parseFloat(v("bKg"));if(!k){alert("Indiquez un poids.");return;}DB.biodechets.push({id:uid(),date:v("bDate")||today(),kg:k});save();render();break;}
    case"delBiod":DB.biodechets=DB.biodechets.filter(x=>x.id!==id);save();render();break;
    case"printReg":printRegister();break;
    case"saveSet":{const n=v("setName").trim();if(n)DB.settings.restaurant=n;DB.settings.currency=v("setCur")||"€";DB.settings.address=v("setAddr");save();render();alert("Enregistré ✔");break;}
    case"export":{const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});const u=URL.createObjectURL(blob);const a2=document.createElement("a");a2.href=u;a2.download="mijote-sauvegarde.json";a2.click();break;}
    case"reset":if(confirm("Effacer toutes les données ?")){localStorage.removeItem(KEY);DB=load();edit={prod:null,sup:null};view="onboard";render();}break;
  }
});
document.addEventListener("input",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,id=t.dataset.id,i=t.dataset.i!=null?+t.dataset.i:null;
  if(a==="dashFrom"){dashP.from=t.value;render();return;}
  if(a==="dashTo"){dashP.to=t.value;render();return;}
  if(a==="filter"){const tb=document.getElementById(t.dataset.target);if(tb){const q=t.value.toLowerCase();tb.querySelectorAll("tbody tr").forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q)?"":"none";});}return;}
  if(a==="setStock"){const p=prod(id);if(p){p.stock=parseFloat(t.value)||0;save();}}
  else if(a==="invLineProd"){tmp.invLines[i].productId=t.value;const p=prod(t.value);if(p&&!tmp.invLines[i].price)tmp.invLines[i].price=p.price;paintInvLines();}
  else if(a==="invLineQty"){tmp.invLines[i].qty=parseFloat(t.value)||0;const o=document.getElementById("invTotal");if(o)o.textContent=money(tmp.invLines.reduce((s,l)=>s+(l.qty||0)*(l.price||0),0));}
  else if(a==="invLinePrice"){tmp.invLines[i].price=parseFloat(t.value)||0;const o=document.getElementById("invTotal");if(o)o.textContent=money(tmp.invLines.reduce((s,l)=>s+(l.qty||0)*(l.price||0),0));}
  else if(a==="recLineProd"){tmp.recLines[i].productId=t.value;paintRecLines();}
  else if(a==="recLineQty"){tmp.recLines[i].qty=parseFloat(t.value)||0;paintRecLines();}
  else if(a==="orderQty"){tmp.orderQty[id]=parseFloat(t.value)||0;const p=prod(id),cell=t.closest("tr")?t.closest("tr").lastElementChild:null;if(p&&cell)cell.textContent=money((p.price||0)*tmp.orderQty[id]);}
  else if(t.id==="rPrice")paintRecLines();
});
document.addEventListener("change",e=>{
  const t=e.target.closest("[data-act='logoFile']");if(!t||!t.files||!t.files[0])return;
  const rd=new FileReader();rd.onload=()=>{DB.settings.logo=rd.result;save();render();};rd.readAsDataURL(t.files[0]);
});
render();
</script>
</body>
</html>
